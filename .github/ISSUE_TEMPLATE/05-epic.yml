name: "Epic"
description: "Coordinate a larger outcome through multiple independently tracked issues."
type: "Epic"

body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><strong>Title guidelines</strong></summary>

        Describe the larger outcome the Epic should achieve, rather than the project activity, implementation mechanism, or collection of work used to achieve it.

        Epic titles should remain meaningful even as their eventual decomposition changes.

        **Good:** `Provide resilient multilingual responses`  
        **Good:** `Enable content-aware image description workflows`  
        **Good:** `Standardize deployment and rollback across services`  
        **Avoid:** `Translation work`, `Big deployment project`, or `[Epic] Update services`

        Do not add an `Epic` prefix or encode priority, status, or ownership in the title. The native issue type and project-management metadata are managed separately.

        </details>

        <details>
        <summary><strong>Issue type classification</strong></summary>

        | Issue type | Use it when… |
        | --- | --- |
        | Bug | Existing intended behaviour is incorrect, broken, or has regressed. |
        | Feature | A new capability or meaningful behaviour change is proposed. |
        | Task | The required work is known and does not correct a defect. |
        | Investigation | A bounded question must be answered before work can be defined. |
        | ***Epic*** | ***One larger outcome requires several independently tracked issues.*** |

        Issue type is determined by the **nature of the work**, not by its size, urgency, importance, or difficulty.

        Use an Epic when achieving one larger outcome requires coordination across multiple independently manageable Bugs, Features, Tasks, or Investigations. Do not use an Epic merely because an individual issue is large or difficult.

        The initial decomposition does not need to be complete. Create or attach GitHub sub-issues as the work becomes understood, and use native dependency relationships where sequencing or blocking relationships matter.

        </details>

        <details>
        <summary><strong>Definition of ready</strong></summary>

        An Epic is **ready for active coordination and decomposition** when its larger outcome and boundaries are sufficiently clear to begin organizing meaningful child work.

        In general:

        - The larger outcome is clearly stated.
        - The value, problem, or strategic need justifying the Epic is understood.
        - The major boundaries of the Epic are sufficiently clear.
        - Success criteria describe how the outcome will be evaluated beyond simply closing child issues.
        - At least the initial workstreams, capabilities, or questions can be identified.
        - Material cross-repository, external, sequencing, or compatibility constraints are understood where applicable.

        An Epic does **not** need a complete decomposition before it is ready. Discovering, refining, adding, or removing sub-issues is expected as the work develops.

        An Epic also does **not** need to satisfy the Definition of Ready when first created. It may remain in triage while its outcome, boundaries, or initial decomposition are refined.

        </details>

  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "State the larger result this Epic should achieve. Describe the completed capability or operational state rather than the implementation activity."
      placeholder: |
        Example:
        Provide resilient multilingual responses so supported requests can continue through an approved fallback when the primary translation provider is unavailable.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context and value"
      description: "Explain the problem, opportunity, or strategic need and why the outcome requires coordination across multiple independently tracked issues."
      placeholder: |
        Example:
        Translation currently depends on one external service. Provider outages interrupt several handlers and require manual intervention. Resilience requires coordinated changes across provider selection, shared services, handlers, monitoring, and operations.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Scope and expected workstreams"
      description: "Describe the major capabilities, areas of work, or questions expected to contribute to the Epic. Use GitHub sub-issues for the actual decomposition as it becomes known."
      placeholder: |
        Example:
        - Define supported provider-fallback behaviour.
        - Investigate provider-failure signals and selection strategies.
        - Implement health detection and provider routing.
        - Update affected handlers and shared interfaces.
        - Add monitoring, documentation, and failure testing.
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: "Success criteria"
      description: "Describe observable or measurable evidence that the larger outcome has been achieved. Closing all child issues is progress, but is not by itself evidence of success."
      placeholder: |
        Example:
        - [ ] A primary-provider outage does not interrupt supported multilingual request workflows.
        - [ ] Fallback activation and recovery are visible to operators.
        - [ ] Affected handlers behave consistently during fallback.
        - [ ] Privacy, security, and operational requirements are satisfied.
        - [ ] The fallback process is documented and validated through a representative failure exercise.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: "Constraints and out of scope"
      description: "Optional. Record important boundaries, compatibility requirements, release constraints, external dependencies, sequencing concerns, or adjacent outcomes that are explicitly excluded."
      placeholder: |
        Example:
        - Existing handler interfaces must remain backward compatible.
        - Provider approval is required before production use.
        - Selecting an entirely new primary translation provider is out of scope.
        - Deployment must support independent rollback.

  - type: textarea
    id: existing-work
    attributes:
      label: "Existing and related work"
      description: "Optional. Link issues, pull requests, Investigations, designs, incidents, or external commitments that may belong under or inform this Epic."
      placeholder: |
        Example:
        - Existing Feature that may become a sub-issue: #123
        - Related Investigation: #124
        - Prior incident: ...
        - Design or architectural decision: ...

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "This outcome requires multiple independently tracked issues rather than one Feature or Task."
          required: true
        - label: "I will use GitHub sub-issues rather than maintaining a duplicate child-issue checklist in this description."
          required: true
        - label: "I removed secrets, credentials, personal information, and confidential data."
          required: true
