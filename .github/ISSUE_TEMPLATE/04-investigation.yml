name: "Investigation"
description: "Answer a bounded question before making a decision or defining implementation."
type: "Investigation"

body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><strong>Title guidelines</strong></summary>

        Describe the question, comparison, measurement, or uncertainty being resolved. The title should make the intended knowledge outcome clear rather than merely describing research activity.

        Useful verbs include `Determine`, `Evaluate`, `Compare`, `Identify`, `Establish`, and `Measure`.

        **Good:** `Determine whether schema validation can move to the orchestrator without increasing request latency`  
        **Good:** `Evaluate fallback strategies for translation-provider outages`  
        **Good:** `Compare chart-description quality across the supported vision models`  
        **Avoid:** `Research schemas`, `Look into translation`, or `[Investigation] Test models`

        Do not add an `Investigation` prefix or encode priority, status, or ownership in the title. The native issue type and project-management metadata are managed separately.

        </details>

        <details>
        <summary><strong>Issue type classification</strong></summary>

        | Issue type | Use it when… |
        | --- | --- |
        | Bug | Existing intended behaviour is incorrect, broken, or has regressed. |
        | Feature | A new capability or meaningful behaviour change is proposed. |
        | Task | The required work is known and does not correct a defect. |
        | ***Investigation*** | ***A bounded question must be answered before work can be defined.*** |
        | Epic | One larger outcome requires several independently tracked issues. |

        Issue type is determined by the **nature of the work**, not by its size, urgency, or difficulty.

        Use an Investigation when the primary deliverable is **knowledge, evidence, a comparison, or a recommendation** that enables a later decision. Production implementation should normally be tracked separately.

        Do not create an Investigation merely because a Bug requires debugging. Diagnosis may be part of resolving the Bug. An Investigation is appropriate when answering the question is itself a distinct, reusable outcome or when the answer is needed before implementation work can be meaningfully defined.

        </details>

        <details>
        <summary><strong>Definition of ready</strong></summary>

        An Investigation is **ready for active work** when the uncertainty being resolved is sufficiently bounded and the team understands what decision or next step the resulting evidence should inform.

        In general:

        - One primary question is clearly stated.
        - The decision or next step enabled by the answer is understood.
        - Relevant current knowledge and material unknowns have been identified where available.
        - A proportionate approach for collecting or evaluating evidence can be described.
        - Completion criteria establish a reasonable stopping condition.
        - Required data, tools, access, participants, or other resources are available or their absence is explicitly understood.

        An Investigation does **not** need to satisfy the Definition of Ready when it is first created. It may remain in triage while the question is narrowed, required access is obtained, or an appropriate method is established.

        The goal is sufficient evidence for a decision—not certainty beyond what the decision reasonably requires.

        </details>

  - type: textarea
    id: question
    attributes:
      label: "Question to answer"
      description: "State one bounded question. It should be possible to explain what evidence would constitute a useful answer."
      placeholder: |
        Example:
        Can schema validation be performed in the orchestrator without materially increasing request latency or duplicating validation logic across services?
    validations:
      required: true

  - type: textarea
    id: decision-enabled
    attributes:
      label: "Decision or next step this enables"
      description: "Explain what decision, design choice, prioritization, or follow-up work depends on the result."
      placeholder: |
        Example:
        The result will determine whether validation should remain distributed across preprocessors or be consolidated in the orchestrator during the next schema revision.
    validations:
      required: true

  - type: textarea
    id: current-understanding
    attributes:
      label: "Current understanding and key unknowns"
      description: "Optional. Summarize relevant confirmed facts, assumptions, hypotheses, and uncertainties."
      placeholder: |
        Example:
        Confirmed:
        - Each preprocessor currently performs its own schema validation.

        Current hypothesis:
        - Central validation may simplify error handling without significant latency impact.

        Key unknowns:
        - The measurable latency cost.
        - Whether preprocessor-specific constraints can be represented centrally.

  - type: textarea
    id: approach
    attributes:
      label: "Proposed approach"
      description: "Describe a proportionate analysis, experiment, prototype, benchmark, literature review, interview, code review, or other method for answering the question."
      placeholder: |
        Example:
        1. Inventory validation behaviour across preprocessors.
        2. Implement a minimal local prototype of orchestrator-level validation.
        3. Benchmark representative requests with and without central validation.
        4. Compare the alternatives and document the findings.
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: "Completion criteria"
      description: "Define the evidence and documentation required to consider the question sufficiently answered. Do not require production implementation."
      placeholder: |
        Example:
        - [ ] Current validation behaviour and constraints are documented.
        - [ ] Latency impact is measured using representative requests.
        - [ ] Material trade-offs and unresolved uncertainties are identified.
        - [ ] A supported recommendation or conclusion is documented.
        - [ ] Resulting implementation work is tracked separately.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Evidence and related work"
      description: "Optional. Link or attach relevant data, papers, logs, code, prior Investigations, related issues, designs, or external references."
      placeholder: |
        Example:
        - Prior Investigation: #123
        - Related Feature: #124
        - Representative benchmark data: ...
        - Relevant research: ...

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "I kept this Investigation focused on one bounded question with a clear stopping condition."
          required: true
        - label: "I will track resulting production implementation as separate Bugs, Features, or Tasks."
          required: true
        - label: "I removed secrets, credentials, personal information, and confidential data."
          required: true
