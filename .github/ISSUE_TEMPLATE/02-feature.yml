name: "Feature request"
description: "Propose a new capability or meaningful change in behaviour."
type: "Feature"

body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><strong>Title guidelines</strong></summary>

        Describe the capability or meaningful behaviour change that should become possible. Prefer an outcome-oriented title rather than the implementation activity expected to produce it.

        Useful verbs include `Support`, `Enable`, `Allow`, `Provide`, `Add`, and `Improve`.

        **Good:** `Support multilingual text-to-speech responses`  
        **Good:** `Allow handlers to request diagram-specific descriptions`  
        **Good:** `Provide fallback when the primary translation service is unavailable`  
        **Avoid:** `New TTS feature`, `Update translation code`, or `[Feature] Add fallback`

        Do not add a `Feature` prefix or encode priority, status, or ownership in the title. The native issue type and project-management metadata are managed separately.

        </details>

        <details>
        <summary><strong>Issue type classification</strong></summary>

        | Issue type | Use it when… |
        | --- | --- |
        | Bug | Existing intended behaviour is incorrect, broken, or has regressed. |
        | ***Feature*** | ***A new capability or meaningful behaviour change is proposed.*** |
        | Task | The required work is known and does not correct a defect. |
        | Investigation | A bounded question must be answered before work can be defined. |
        | Epic | One larger outcome requires several independently tracked issues. |

        Issue type is determined by the **nature of the work**, not by its size, urgency, or difficulty. A small new capability may still be a Feature, while a large but well-defined implementation activity may still be a Task.

        A Feature defines **what should become possible and why it matters**. It should not prescribe every implementation step. Independently manageable implementation work may later be tracked as Tasks or other sub-issues.

        </details>

        <details>
        <summary><strong>Definition of ready</strong></summary>

        A Feature is **ready for implementation planning or active work** when its intended outcome is sufficiently defined that the team can make implementation decisions without first resolving fundamental product or scope ambiguity.

        In general:

        - The problem or opportunity is understood.
        - The desired outcome is clear.
        - Acceptance criteria describe observable conditions for accepting the Feature.
        - Important constraints, non-goals, and compatibility requirements are identified where applicable.
        - Material unknowns that could change the intended outcome have been resolved or separated into Investigations.
        - The Feature represents one coherent capability or behaviour change.

        A Feature does **not** need to satisfy the Definition of Ready when it is first created. It may remain in triage or backlog while the outcome, evidence, or acceptance criteria are refined.

        </details>

  - type: textarea
    id: problem
    attributes:
      label: "Problem or opportunity"
      description: "Describe the unmet need, limitation, inefficiency, risk, or opportunity. Explain what is difficult, impossible, unreliable, or unnecessarily costly today."
      placeholder: |
        Example:
        Handlers currently receive only a general image description. They cannot request a description specialized for diagrams, so important labels, relationships, and structural details may be omitted or described inconsistently.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: "Desired outcome"
      description: "Describe what users, systems, or workflows should be able to accomplish and why it matters. Keep the outcome independent of a preferred implementation where possible."
      placeholder: |
        Example:
        Handlers should be able to request a diagram-specific description through a supported interface so accessible experiences preserve important labels, relationships, hierarchy, and directional connections.
    validations:
      required: true

  - type: textarea
    id: beneficiaries
    attributes:
      label: "Affected users, systems, or workflows"
      description: "Optional. Identify who or what experiences the need and the context in which the capability matters."
      placeholder: |
        Example:
        - Users relying on accessible diagram experiences
        - Handlers that generate diagram descriptions
        - Developers integrating diagram-processing components

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "List observable conditions that must be satisfied for the Feature to be accepted. Describe outcomes rather than implementation activity."
      placeholder: |
        Example:
        - [ ] Handlers can request diagram-specific descriptions through a documented and supported interface.
        - [ ] Representative outputs preserve materially relevant labels and relationships.
        - [ ] Existing photo, chart, and map workflows remain unchanged.
        - [ ] The capability can be verified through automated tests or documented representative examples.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: "Constraints and non-goals"
      description: "Optional. Record requirements the solution must respect, adjacent capabilities that are excluded, or important boundaries that prevent unnecessary scope expansion."
      placeholder: |
        Example:
        - Preserve compatibility with existing handler requests.
        - Do not expose provider-specific configuration through the shared schema.
        - Redesigning chart and map descriptions is out of scope.

  - type: textarea
    id: additional-context
    attributes:
      label: "Evidence and related work"
      description: "Optional. Link or attach user feedback, representative examples, designs, research, related issues, pull requests, or prior Investigations."
      placeholder: |
        Example:
        - User or stakeholder feedback: ...
        - Related Investigation: #123
        - Related design: #124
        - Representative input or output: ...

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "I searched existing issues and kept this request focused on one coherent capability or behaviour change."
          required: true
        - label: "I described the required outcome rather than prescribing an implementation unnecessarily."
          required: true
        - label: "I removed secrets, credentials, personal information, and confidential data."
          required: true
