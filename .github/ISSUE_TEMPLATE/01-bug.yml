name: "Bug report"
description: "Report behaviour that is incorrect, broken, or regressed."
type: "Bug"

body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><strong>Title guidelines</strong></summary>

        Describe the affected component or workflow, the incorrect behaviour, and any important condition needed to distinguish the problem.

        Good titles identify **what is wrong** rather than simply stating that a bug exists.

        **Good:** `Orchestrator returns a cached response for a request with a different schema`  
        **Good:** `Diagram preprocessor produces an empty description for SVG inputs`  
        **Avoid:** `Bug`, `Something is broken`, or `[High Priority] Fix orchestrator`

        Do not add a `Bug` prefix or encode priority, status, or ownership in the title. The native issue type and project-management metadata are managed separately.

        </details>

        <details>
        <summary><strong>Issue type classification</strong></summary>

        | Issue type | Use it when… |
        | --- | --- |
        | ***Bug*** | ***Existing intended behaviour is incorrect, broken, or has regressed.*** |
        | Feature | A new capability or meaningful behaviour change is proposed. |
        | Task | The required work is known and does not correct a defect. |
        | Investigation | A bounded question must be answered before work can be defined. |
        | Epic | One larger outcome requires several independently tracked issues. |

        Issue type is determined by the **nature of the work**, not by its size, urgency, or difficulty.

        Use a Bug when the system already has an intended behaviour and the observed behaviour does not match it. Root-cause analysis and diagnosis may be part of fixing a Bug; do not create a separate Investigation merely because the cause is not yet known.

        </details>

        <details>
        <summary><strong>Definition of ready</strong></summary>

        A Bug is **ready for active work** when the team has enough information to begin a meaningful diagnosis or fix without first resolving major ambiguity.

        In general:

        - The observed and expected behaviours are clearly distinguished.
        - Reproduction steps, a failing example, or sufficient diagnostic context are available.
        - The affected component or workflow can be identified well enough to begin investigation.
        - Material blockers, dependencies, or missing access are identified.
        - The issue is scoped to one independently fixable defect where practical.

        An issue does **not** need to satisfy the Definition of Ready when it is first created. Incomplete reports may remain in triage while information is collected or scope is refined.

        </details>

  - type: textarea
    id: observed-behaviour
    attributes:
      label: "Observed behaviour"
      description: "Describe exactly what happened. Include incorrect output, visible symptoms, state changes, or exact error messages."
      placeholder: |
        Example:
        Requests containing a diagram are accepted by the orchestrator, but the completed response contains no generated description and no error is returned.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "Expected behaviour"
      description: "Describe what should happen. Reference documentation, an accepted design, or previous behaviour when available."
      placeholder: |
        Example:
        The orchestrator should return the generated diagram description, or a clear error explaining why the request could not be processed.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction"
      description: "Give the shortest reliable steps, input, or command. If the bug cannot be reproduced reliably, describe when and how it occurred."
      placeholder: |
        Example:
        1. Start the standard development stack.
        2. Submit the attached diagram to `POST /request`.
        3. Wait for the completed response.
        4. Observe that the response contains no generated description.
    validations:
      required: true

  - type: textarea
    id: runtime-context
    attributes:
      label: "Runtime context"
      description: "Optional. Include only context that may affect the bug, such as a commit, deployment, browser, runtime, model, hardware, or non-default configuration."
      placeholder: |
        Example:
        - Commit: `abc1234`
        - Environment: production
        - Configuration: `host=localhost port=1234`

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Optional. Add redacted logs, screenshots, sample files, request IDs, workarounds, hypotheses, or related issues."
      placeholder: |
        Example:
        - Related issue: #123
        - Workaround: Restarting the service temporarily restores expected behaviour.
        ```
        404: Page not found
        ```

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "I searched existing issues and kept this report focused on one independently fixable bug."
          required: true
        - label: "I removed secrets, credentials, personal information, and confidential data."
          required: true
