name: "Task"
description: "Complete a known unit of work with a clear, verifiable outcome."
type: "Task"

body:
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><strong>Title guidelines</strong></summary>

        Begin with a specific action verb and describe the resulting change or deliverable. A Task title should make the expected work recognizable without requiring the reader to open the issue.

        Useful verbs include `Add`, `Update`, `Remove`, `Document`, `Configure`, `Migrate`, `Refactor`, and `Replace`.

        **Good:** `Add request IDs to orchestrator error responses`  
        **Good:** `Document the production rollback procedure`  
        **Good:** `Update the shared request schema to include locale`  
        **Avoid:** `Logging task`, `Work on deployment`, or `[Task] Update code`

        Do not add a `Task` prefix or encode priority, status, or ownership in the title. The native issue type and project-management metadata are managed separately.

        </details>

        <details>
        <summary><strong>Issue type classification</strong></summary>

        | Issue type | Use it when… |
        | --- | --- |
        | Bug | Existing intended behaviour is incorrect, broken, or has regressed. |
        | Feature | A new capability or meaningful behaviour change is proposed. |
        | ***Task*** | ***The required work is known and does not correct a defect.*** |
        | Investigation | A bounded question must be answered before work can be defined. |
        | Epic | One larger outcome requires several independently tracked issues. |

        Issue type is determined by the **nature of the work**, not by its size, urgency, or difficulty.

        Use a Task when the required outcome is already sufficiently understood and the issue represents a concrete, independently completable unit of implementation, maintenance, documentation, configuration, migration, refactoring, or operational work.

        If the desired capability itself still needs to be defined, use a Feature. If evidence is needed before the required work can be determined, use an Investigation.

        </details>

        <details>
        <summary><strong>Definition of ready</strong></summary>

        A Task is **ready for active work** when a contributor can reasonably begin implementation without first resolving major uncertainty about what outcome is required.

        In general:

        - The objective is clear and sufficiently specific.
        - Acceptance criteria are observable and verifiable.
        - Required inputs, decisions, access, and technical information are available.
        - Material blockers and dependencies are identified and resolved where necessary.
        - Important implementation constraints are known.
        - The work is scoped so it can be completed and reviewed independently.

        A Task does **not** need to satisfy the Definition of Ready when it is first created. Tasks may remain in triage or backlog while missing information, dependencies, or scope are resolved.

        Straightforward Tasks should remain straightforward. Do not add unnecessary specification merely to make the issue appear more complete.

        </details>

  - type: textarea
    id: objective
    attributes:
      label: "Objective"
      description: "State the concrete result this Task must produce. A short description is sufficient for straightforward work."
      placeholder: |
        Example:
        Add the existing request ID to orchestrator error responses so failures can be matched to the corresponding server logs.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "Optional. Explain why the work is needed or provide information necessary to understand the Task."
      placeholder: |
        Example:
        Production error responses cannot currently be matched reliably to request-specific logs. The orchestrator already creates a request ID internally, but it is not returned to callers.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "List the observable conditions required to accept the Task as complete. One or two criteria may be sufficient for a simple Task."
      placeholder: |
        Example:
        - [ ] Applicable orchestrator error responses include the request ID.
        - [ ] The returned value matches the ID written to the corresponding logs.
        - [ ] Existing successful-response behaviour remains unchanged.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context and related work"
      description: "Optional. Add constraints, implementation notes, validation considerations, dependencies, parent work, related issues, or pull requests when useful."
      placeholder: |
        Example:
        - Preserve backward compatibility with existing response fields.
        - Parent Epic: #123
        - Depends on: #124
        - Related pull request: #125

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "I searched existing issues and kept this Task focused on one independently completable outcome."
          required: true
        - label: "The acceptance criteria are sufficient to determine when this Task is complete."
          required: true
        - label: "I removed secrets, credentials, personal information, and confidential data."
          required: true
