name: IMAGE Project status

on:
  issues:
    types:
      - opened
      - reopened
      - closed

  create:

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - closed

  pull_request_review:
    types:
      - submitted
      - dismissed

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: >-
    image-project-${{ github.event.issue.number ||
    github.event.pull_request.number ||
    github.event.ref ||
    github.run_id }}
  cancel-in-progress: false

jobs:
  sync-project-status:
    name: Sync issue status
    if: >-
      (github.event_name != 'create' || github.event.ref_type == 'branch') &&
      (github.event_name != 'pull_request_review' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Generate IMAGE Project token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IMAGE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PROJECT_APP_PRIVATE_KEY }}
          owner: Shared-Reality-Lab
          repositories: IMAGE-server

      - name: Synchronize Project status
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          script: |
            const ORGANIZATION = "Shared-Reality-Lab";
            const REPOSITORY = "IMAGE-server";
            const PROJECT_NUMBER = 2;
            const STATUS_FIELD_NAME = "Status";

            const STATUS = Object.freeze({
              TRIAGE: "Triage",
              BACKLOG: "Backlog",
              READY: "Ready",
              IN_PROGRESS: "In Progress",
              IN_REVIEW: "In Review",
              READY_TO_MERGE: "Ready to Merge",
              DONE: "Done",
            });

            const allowedTransitions = new Map([
              [STATUS.TRIAGE, new Set([STATUS.DONE])],
              [STATUS.BACKLOG, new Set([STATUS.DONE])],
              [STATUS.READY, new Set([
                STATUS.IN_PROGRESS,
                STATUS.IN_REVIEW,
                STATUS.DONE,
              ])],
              [STATUS.IN_PROGRESS, new Set([
                STATUS.IN_REVIEW,
                STATUS.DONE,
              ])],
              [STATUS.IN_REVIEW, new Set([
                STATUS.IN_PROGRESS,
                STATUS.READY_TO_MERGE,
                STATUS.DONE,
              ])],
              [STATUS.READY_TO_MERGE, new Set([
                STATUS.IN_PROGRESS,
                STATUS.IN_REVIEW,
                STATUS.DONE,
              ])],
              [STATUS.DONE, new Set([STATUS.TRIAGE])],
            ]);

            async function loadProject() {
              const result = await github.graphql(`
                query ProjectConfiguration(
                  $organization: String!
                  $projectNumber: Int!
                ) {
                  organization(login: $organization) {
                    projectV2(number: $projectNumber) {
                      id
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                organization: ORGANIZATION,
                projectNumber: PROJECT_NUMBER,
              });

              const project = result.organization?.projectV2;

              if (!project) {
                throw new Error(
                  `Could not access ${ORGANIZATION} Project #${PROJECT_NUMBER}. ` +
                  "Verify the GitHub App installation and its organization " +
                  "Projects read/write permission."
                );
              }

              const statusField = project.fields.nodes.find(
                (field) => field?.name === STATUS_FIELD_NAME
              );

              if (!statusField) {
                throw new Error(
                  `Project #${PROJECT_NUMBER} does not contain a ` +
                  `${STATUS_FIELD_NAME} single-select field.`
                );
              }

              const optionIds = new Map(
                statusField.options.map((option) => [option.name, option.id])
              );

              for (const requiredStatus of Object.values(STATUS)) {
                if (!optionIds.has(requiredStatus)) {
                  throw new Error(
                    `Project #${PROJECT_NUMBER} is missing the ` +
                    `"${requiredStatus}" Status option.`
                  );
                }
              }

              return {
                id: project.id,
                statusFieldId: statusField.id,
                optionIds,
              };
            }

            const project = await loadProject();

            async function findIssueAndProjectItem(issueId) {
              const result = await github.graphql(`
                query IssueProjectItem($issueId: ID!) {
                  node(id: $issueId) {
                    ... on Issue {
                      id
                      number
                      state
                      repository {
                        nameWithOwner
                      }
                      projectItems(first: 100) {
                        nodes {
                          id
                          project {
                            id
                          }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { issueId });

              const issue = result.node;

              if (!issue) {
                throw new Error(`Could not find issue node ${issueId}.`);
              }

              const item = issue.projectItems.nodes.find(
                (candidate) => candidate.project.id === project.id
              );

              return { issue, item };
            }

            async function addIssueToProject(issueId) {
              const result = await github.graphql(`
                mutation AddIssueToProject(
                  $projectId: ID!
                  $issueId: ID!
                ) {
                  addProjectV2ItemById(input: {
                    projectId: $projectId
                    contentId: $issueId
                  }) {
                    item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                issueId,
              });

              return result.addProjectV2ItemById.item.id;
            }

            async function setIssueStatus(issueId, desiredStatus, options = {}) {
              const { force = false } = options;
              let { issue, item } = await findIssueAndProjectItem(issueId);

              if (issue.repository.nameWithOwner !== `${ORGANIZATION}/${REPOSITORY}`) {
                core.warning(
                  `Skipping ${issue.repository.nameWithOwner}#${issue.number}; ` +
                  `this pilot only manages ${ORGANIZATION}/${REPOSITORY}.`
                );
                return;
              }

              if (!item) {
                const itemId = await addIssueToProject(issueId);
                item = {
                  id: itemId,
                  fieldValueByName: null,
                };
              }

              const currentStatus = item.fieldValueByName?.name ?? null;

              if (currentStatus === desiredStatus) {
                core.info(
                  `${issue.repository.nameWithOwner}#${issue.number} is ` +
                  `already ${desiredStatus}.`
                );
                return;
              }

              if (!force && currentStatus !== null) {
                const allowed = allowedTransitions.get(currentStatus);

                if (!allowed?.has(desiredStatus)) {
                  core.warning(
                    `Refusing unexpected transition for ` +
                    `${issue.repository.nameWithOwner}#${issue.number}: ` +
                    `${currentStatus} -> ${desiredStatus}.`
                  );
                  return;
                }
              }

              const optionId = project.optionIds.get(desiredStatus);

              await github.graphql(`
                mutation UpdateIssueStatus(
                  $projectId: ID!
                  $itemId: ID!
                  $fieldId: ID!
                  $optionId: String!
                ) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: {
                      singleSelectOptionId: $optionId
                    }
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                itemId: item.id,
                fieldId: project.statusFieldId,
                optionId,
              });

              core.notice(
                `Moved ${issue.repository.nameWithOwner}#${issue.number}: ` +
                `${currentStatus ?? "No status"} -> ${desiredStatus}.`
              );
            }

            async function getPullRequest(number) {
              const result = await github.graphql(`
                query PullRequestStatus(
                  $owner: String!
                  $repo: String!
                  $number: Int!
                ) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      number
                      state
                      merged
                      isDraft
                      reviewDecision
                      closingIssuesReferences(first: 10) {
                        nodes {
                          id
                          number
                          state
                          repository {
                            nameWithOwner
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: ORGANIZATION,
                repo: REPOSITORY,
                number,
              });

              return result.repository?.pullRequest ?? null;
            }

            function getSingleTrackingIssue(pullRequest) {
              const issues = pullRequest.closingIssuesReferences.nodes;

              if (issues.length !== 1) {
                core.warning(
                  `PR #${pullRequest.number} has ${issues.length} closing ` +
                  "issue references; expected exactly one."
                );
                return null;
              }

              const issue = issues[0];

              if (issue.repository.nameWithOwner !== `${ORGANIZATION}/${REPOSITORY}`) {
                core.warning(
                  `PR #${pullRequest.number} tracks ` +
                  `${issue.repository.nameWithOwner}#${issue.number}; ` +
                  `this pilot only manages ${ORGANIZATION}/${REPOSITORY}.`
                );
                return null;
              }

              return issue;
            }

            async function syncPullRequest(number, reason, preferredStatus = null) {
              const pullRequest = await getPullRequest(number);

              if (!pullRequest) {
                core.warning(`Could not find PR #${number}.`);
                return;
              }

              const issue = getSingleTrackingIssue(pullRequest);

              if (!issue) {
                return;
              }

              let desiredStatus = preferredStatus;

              if (pullRequest.merged) {
                desiredStatus = STATUS.DONE;
              } else if (pullRequest.state === "CLOSED") {
                desiredStatus = STATUS.IN_PROGRESS;
              } else if (desiredStatus !== null) {
                // Use the event-specific transition supplied by the caller.
              } else if (pullRequest.isDraft) {
                desiredStatus = STATUS.IN_PROGRESS;
              } else if (pullRequest.reviewDecision === "APPROVED") {
                desiredStatus = STATUS.READY_TO_MERGE;
              } else {
                desiredStatus = STATUS.IN_REVIEW;
              }

              core.info(
                `Reconciling PR #${number} because ${reason}; ` +
                `desired issue status is ${desiredStatus}.`
              );

              await setIssueStatus(issue.id, desiredStatus, {
                force: desiredStatus === STATUS.DONE,
              });
            }

            async function reconcileOpenPullRequests() {
              const pullRequests = await github.paginate(
                github.rest.pulls.list,
                {
                  owner: ORGANIZATION,
                  repo: REPOSITORY,
                  state: "open",
                  per_page: 100,
                }
              );

              core.info(`Reconciling ${pullRequests.length} open pull requests.`);

              for (const pullRequest of pullRequests) {
                await syncPullRequest(
                  pullRequest.number,
                  `${context.eventName} reconciliation`
                );
              }
            }

            async function handleIssueEvent() {
              const issueId = context.payload.issue.node_id;

              switch (context.payload.action) {
                case "opened":
                  await setIssueStatus(issueId, STATUS.TRIAGE, { force: true });
                  return;
                case "reopened":
                  await setIssueStatus(issueId, STATUS.TRIAGE, { force: true });
                  return;
                case "closed":
                  await setIssueStatus(issueId, STATUS.DONE, { force: true });
                  return;
                default:
                  return;
              }
            }

            async function handleBranchCreated() {
              if (context.payload.ref_type !== "branch") {
                return;
              }

              const branchName = context.payload.ref;
              const match = branchName.match(/(?:^|\/)(\d+)(?:[-_/]|$)/);

              if (!match) {
                core.info(
                  `Branch "${branchName}" does not begin with an issue number.`
                );
                return;
              }

              const issueNumber = Number(match[1]);
              let response;

              try {
                response = await github.rest.issues.get({
                  owner: ORGANIZATION,
                  repo: REPOSITORY,
                  issue_number: issueNumber,
                });
              } catch (error) {
                if (error.status === 404) {
                  core.warning(
                    `Branch "${branchName}" references missing issue #${issueNumber}.`
                  );
                  return;
                }
                throw error;
              }

              const issue = response.data;

              if (issue.pull_request || issue.state !== "open") {
                core.warning(
                  `Branch "${branchName}" does not reference an open issue.`
                );
                return;
              }

              const actorIsAssignee = issue.assignees.some(
                (assignee) => assignee.login === context.actor
              );

              if (!actorIsAssignee) {
                core.warning(
                  `@${context.actor} created "${branchName}" but is not ` +
                  `assigned to issue #${issueNumber}; status was not changed.`
                );
                return;
              }

              await setIssueStatus(issue.node_id, STATUS.IN_PROGRESS);
            }

            async function handleIssueCommand() {
              if (context.payload.issue.pull_request) {
                return;
              }

              const command = context.payload.comment.body.trim().toLowerCase();

              if (command !== "/start" && command !== "/done") {
                return;
              }

              const association = context.payload.comment.author_association;
              const trustedAssociations = new Set([
                "OWNER",
                "MEMBER",
                "COLLABORATOR",
              ]);

              if (!trustedAssociations.has(association)) {
                core.setFailed(
                  `@${context.actor} is not authorized to run ${command}.`
                );
                return;
              }

              const response = await github.rest.issues.get({
                owner: ORGANIZATION,
                repo: REPOSITORY,
                issue_number: context.payload.issue.number,
              });

              const issue = response.data;

              if (command === "/start") {
                const actorIsAssignee = issue.assignees.some(
                  (assignee) => assignee.login === context.actor
                );

                if (!actorIsAssignee && association !== "OWNER") {
                  core.setFailed(
                    `@${context.actor} must be assigned to issue ` +
                    `#${issue.number} before running /start.`
                  );
                  return;
                }

                await setIssueStatus(issue.node_id, STATUS.IN_PROGRESS);
                return;
              }

              await github.rest.issues.update({
                owner: ORGANIZATION,
                repo: REPOSITORY,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });

              await setIssueStatus(issue.node_id, STATUS.DONE, { force: true });
            }

            switch (context.eventName) {
              case "issues":
                await handleIssueEvent();
                break;

              case "create":
                await handleBranchCreated();
                break;

              case "issue_comment":
                await handleIssueCommand();
                break;

              case "pull_request_target": {
                const action = context.payload.action;
                let preferredStatus = null;

                if (action === "converted_to_draft") {
                  preferredStatus = STATUS.IN_PROGRESS;
                } else if (
                  action === "opened" ||
                  action === "reopened" ||
                  action === "ready_for_review" ||
                  action === "synchronize"
                ) {
                  preferredStatus = context.payload.pull_request.draft
                    ? STATUS.IN_PROGRESS
                    : STATUS.IN_REVIEW;
                }

                await syncPullRequest(
                  context.payload.pull_request.number,
                  `${context.eventName}.${action}`,
                  preferredStatus
                );
                break;

              }

              case "pull_request_review": {
                const action = context.payload.action;
                const reviewState = context.payload.review?.state?.toLowerCase();

                if (action === "submitted" && reviewState === "commented") {
                  core.info("A comment-only review does not change Project status.");
                  break;
                }

                const preferredStatus =
                  action === "dismissed" || reviewState === "changes_requested"
                    ? STATUS.IN_REVIEW
                    : null;

                await syncPullRequest(
                  context.payload.pull_request.number,
                  `${context.eventName}.${action}`,
                  preferredStatus
                );
                break;

              }

              case "schedule":
              case "workflow_dispatch":
                await reconcileOpenPullRequests();
                break;

              default:
                core.info(`No handler for ${context.eventName}.`);
            }
